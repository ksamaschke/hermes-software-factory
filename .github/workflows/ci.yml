name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pip install --editable runtime
      - run: python -m pytest tests runtime/tests -q
