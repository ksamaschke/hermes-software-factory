# Generic cron topology for supervising one project-level software factory.
# Replace angle-bracket values with project-owned, non-secret values. This is a
# contract example, not a complete user-local Hermes configuration.
version: 1

# Deterministic controllers produce observations only. Their stdout is persisted
# locally by deliver: local and is never routed directly to a human channel.
controllers:
  - id: <board-state-controller-id>
    type: deterministic
    schedule: every 15m
    no_agent: true
    script: <board-state-controller-script>
    deliver: local
    observes:
      - live-board-state

  - id: <tracker-state-controller-id>
    type: deterministic
    schedule: every 15m
    no_agent: true
    script: <tracker-state-controller-script>
    deliver: local
    observes:
      - live-tracker-state

  - id: <repository-state-controller-id>
    type: deterministic
    schedule: every 15m
    no_agent: true
    script: <repository-state-controller-script>
    deliver: local
    observes:
      - live-repository-state

  # This project-owned wrapper invokes forgejo_delivery_controller.py with the
  # non-secret JSON overlay path. The controller itself performs GETs only and
  # discovers matching no-PR branches from the live paginated branch inventory;
  # the overlay contains filters and bounds, not a candidate list.
  - id: <forgejo-delivery-controller-id>
    type: deterministic
    schedule: every 15m
    no_agent: true
    script: <forgejo-delivery-controller-wrapper>
    overlay: <non-secret-forgejo-delivery-overlay-path>
    deliver: local
    observes:
      - forgejo-delivery-state

  - id: <scheduler-attempts-incidents-controller-id>
    type: deterministic
    schedule: every 15m
    no_agent: true
    script: <scheduler-observation-controller-script>
    deliver: local
    observes:
      - scheduler-attempts
      - scheduler-incidents

  # Optional deterministic repair controller. It may terminate only process
  # groups that the exact task readback and worker environment bind to the same
  # terminal task. It must emit bounded sanitized status and remain local-only.
  - id: <terminal-worker-recovery-controller-id>
    type: deterministic-repair
    schedule: every 5m
    no_agent: true
    script: <factory-recovery-wrapper>
    deliver: local
    mutates:
      - task-owned-terminal-process-groups-only
    observes:
      - terminal-kanban-task-state
      - task-owned-process-groups

# One LLM supervisor consumes every controller output and its own prior result.
# The context_from values are the job IDs returned when the controllers are
# created. Do not create one LLM report job per controller.
supervisor:
  id: <project-supervisor-job-id>
  type: llm
  schedule: every 30m
  no_agent: false
  context_from:
    - <board-state-controller-id>
    - <tracker-state-controller-id>
    - <repository-state-controller-id>
    - <forgejo-delivery-controller-id>
    - <scheduler-attempts-incidents-controller-id>
    - <terminal-worker-recovery-controller-id>
  continuity: true
  workdir: <project-workdir>
  enabled_toolsets:
    - terminal
    - file
    - code_execution
  skills:
    - kanban-factory-operations
    - software-factory-recovery
    - factory-reporting
    - kanban-progress-evidence
  prompt: |
    Read every injected controller output, including scheduler attempts and
    incidents. Treat each controller output as an observation, never proof.
    Read the prior supervisor result supplied by continuity, then inspect live
    board, tracker, repository, dispatcher, and scheduler state yourself.
    Reconcile those sources before classifying the factory as exactly ACTIVE,
    IDLE-BY-GATING, or STALLED.

    Work delta-first from continuity. Finish within ten minutes by default and
    use at most eight read-only command batches plus one recovery mutation and
    its readback. Inspect only changed or currently gating state. Do not scan
    complete repository or board history, run the product's full gate,
    implement product code, or perform the independent review in this job. If
    more work is required, create one exact-scope owned factory task, read it
    back, and stop the tick.

    If the live state is STALLED and a bounded safe internal recovery is
    available, perform it now. Read back every mutation and re-check the live
    state. Never emit a passive stalled report while an internal action remains
    available. Do not bypass review, deployment policy, protected paths, or
    non-delegable human decisions.

    Treat the Forgejo delivery observation as telemetry, not proof. When its
    verified live state is STALLED, create one exact-scope integration or infrastructure-recovery task
    using the owner profile named by the project overlay, read back its task id, scope, status, and assignee,
    then stop the tick. Never create duplicate broad recovery work, merge a pull
    request, edit the overlay to acknowledge a pushed branch, or deploy from
    controller output. Verify the live Forgejo branch inventory instead. Report the configured implementer
    and reviewer route as observed. Gate on vendor-family separation only when the project overlay marks it required;
    preferred and not_required are not framework defects and must not trigger
    global reviewer-profile changes.

    Human delivery is secondary. Send only concise verified progress, completed
    recovery, or one genuine non-delegable decision. Never forward raw
    controller output or raw cron logs. If no human action is required, emit
    [SILENT].
  deliver: <human-delivery-target>
  attach_to_session: true
