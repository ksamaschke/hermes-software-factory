# Project policy template for kanban-implementation-workflow.
# Copy this into a repository policy file and replace every placeholder.
version: 1

tracker:
  kind: forgejo # forgejo, github, gitlab, bitbucket, or custom
  project: owner/repository
  adapter: tea # provider CLI/API/webhook adapter
  base_url: null # required for self-hosted or custom trackers
  dependency_source: body_marker # body_marker, native, or sub_issues when supported
  issue_labels:
    parked: parked
    epic: epic
  base_branch: dev

profiles:
  orchestrator: default
  operator_observer: null # read-only human-facing evidence/transport profile
  implementer: implementer
  code_reviewer: reviewer # concrete profile name may remain reviewer
  completion_verifier: null # optional concrete profile name
  integration_operator: null # creates/verifies PRs and performs policy-controlled merges
  code_reviewer_model_default: null # e.g. provider/strong-model-id
  code_reviewer_model_routine: null # e.g. provider/routine-model-id
  implementer_vendor_family: null # null = unknown; review remains REVIEW-INCOMPLETE until independent
  code_reviewer_vendor_family: null # null = unknown; review remains REVIEW-INCOMPLETE until independent
  qa_ui: null # policy role key -> profile name
  release_operator: null # policy role key -> profile name

decision_authority:
  mode: delegated # delegated | approval_required
  default: smallest_adequate_policy_compliant
  delegated_scope:
    - backlog_admission
    - decomposition
    - ownership
    - sequencing
    - architecture
    - remediation
    - recovery
    - review_routing
    - dependency_resolution
    - artifact_publication
    - non_production_rollout
    - issue_state_progression
  non_delegable:
    - production_approval
    - destructive_or_irreversible_action_without_rollback
    - undefined_safety_critical_value
    - undefined_security_privacy_compliance_or_legal_risk
    - materially_contradictory_requirements
    - unavailable_capability_or_credential
    - material_unapproved_cost_customer_or_data_retention_impact
  required_decision_record:
    - decision
    - rationale
    - assumptions
    - owner
    - dependencies
    - acceptance_evidence
    - rollback_or_fallback
    - next_gate

# The controller passes this compact, provider-neutral envelope to the reasoning
# model. Projects may lower these budgets, but may not omit required identity or
# evidence fields. Runtime adapters enforce the ladder and exact readback.
decision_contract:
  schema: factory.decision.v1
  ladder: [diagnose, choose, act, read_back, advance]
  required_context:
    - execution_mode
    - profile_name
    - source_item
    - phase
    - input_identity
    - current_task
    - current_run
    - blocker
    - parent_completion
    - evidence.scheduler
    - evidence.worker
    - evidence.source
    - evidence.review
  evidence_kinds: [scheduler, worker, source, review]
  budgets:
    max_prompt_chars: 12000
    max_skill_chars: 6000
    max_skills: 4
  repeated_blocker_threshold: 3
  conflict_mode: fail_closed
  current_run_null:
    before_spawn: true
    reused_or_held: true
    new_admission_requires_run: true
  transition_policy:
    quarantine: current_phase
    admit: implementation
    reuse_existing: current_phase
    select_independent_lane: implementation
    repair_artifact: artifact
    hold_missing_capability: current_phase
    hold: current_phase
  denied_capability: hold_or_external_gate

operator_bridge:
  mode: central_transport_only
  enabled: true
  request_marker: OPERATOR_INPUT_REQUIRED
  response_marker: DECISION
  observer_profile: operator_observer
  orchestrator_profile: orchestrator
  mutation_owner: orchestrator
  observer_actions: [read_evidence, transport_decision_response]
  dedupe_on: [source_item, change_request, kanban_task, evidence_fingerprint]

kanban:
  auto_decompose: true
  auto_decompose_per_tick: 3
  max_in_progress: 8 # total cap; tune for aggregate backend capacity
  max_in_progress_per_profile: 2 # conservative start; raise after a capacity probe
  dispatcher_owner: supervised_gateway # the shared factory supports only the supervised gateway owner
  review_dispatch: false

verification:
  headless:
    - cargo test
    - pnpm --filter app test
    - pnpm --filter app build
    - pnpm --filter app lint
  ui_smoke: null
  required_for_ui_changes: false # set true only when ui_smoke is configured
  process_cleanup_required: true

review:
  required: true
  independent_vendor_family: true
  implementer_self_review_is_final: false
  # Adversarial reviews are change-scoped. The only two kinds are pre_commit
  # (working-tree delta vs. base commit) and pre_merge (merge-base delta vs.
  # target branch). Neither may expand into a whole-codebase review.
  kinds: [pre_commit, pre_merge]
  scope: change_set # change_set only; file_list/module/repository are invalid
  # Two-tier runtime budget. A single wall clock covering model latency,
  # provider backoff, and command execution produces kills instead of verdicts.
  dispatch_hard_cap_seconds: 1800 # dispatcher --max-runtime SIGTERM/SIGKILL backstop
  evidence_budget_seconds: 900 # reviewer MUST return a verdict by this point
  command_timeout_seconds: 120 # hard cap on any single command
  max_changed_files_per_leaf: 5
  acceptance_questions_per_leaf: 1
  # The reviewer runs diff-targeted checks only. The full project gate is the
  # implementer's/CI's evidence and is cited, never re-run inside a review.
  reviewer_may_run_full_gate: false
  gate_evidence_source: implementer_ci # cited with command, exit code, run ref, commit
  oversized_change_set: split_then_fan_in # split_then_fan_in | fail_closed

safety:
  protected_paths: []
  secrets_policy: key_env # key_env | vault | none-required
  forbidden_mutations: []

delivery:
  # These are lifecycle requirements, not permission grants. Replace null
  # profiles and provider details in a project-specific policy before use.
  integration:
    required: true
    pull_request_required: true
    host_review_required: true
    merge_requires:
      - independent_review
      - required_ci
      - host_review
    merged_commit_readback_required: true
  release:
    required: true
    deployment_requires_policy: true
    post_action_verification_required: true

# A project may stop after a verified merge only when that policy decision is
# explicit. `unspecified` never means "deploy automatically".
deployment:
  mode: unspecified # gitops_only | direct_allowed | release_only | unspecified
  # direct_cluster_mutation is a hard override; forbidden wins over any mode.
  controller: null  # argocd | flux | platform-release | null
  gitops_repository: null
  direct_cluster_mutation: forbidden

notifications:
  progress_digest_schedule: every 30m
  gateway_home_channel: null
